<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" role="img" aria-label="Player automaton: Player 1 moves to Player 2 on player 1's moves, and back on player 2's moves">
  <style>
    .st { fill: #ffffff; stroke: #101010; stroke-width: 1.5 }
    .in { fill: none; stroke: #101010; stroke-width: 1 }
    .e { fill: none; stroke: #101010; stroke-width: 1.4 }
    .u { stroke-dasharray: 5 4 }
    .ah { fill: #101010 }
    .t { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #101010; text-anchor: middle; dominant-baseline: central }
    .l { font: 12px ui-monospace, Consolas, monospace; fill: #4a4a4a; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round }
    @media (prefers-color-scheme: dark) {
      .st { fill: #151515; stroke: #ededed } .in, .e { stroke: #ededed } .ah { fill: #ededed }
      .t { fill: #ededed } .l { fill: #b5b5b5; stroke: #151515 }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <line class="e" x1="22" y1="118" x2="68" y2="118" marker-end="url(#a)"/>

  <path class="e" d="M140,100 Q260,20 380,100" marker-end="url(#a)"/>
  <text class="l" x="260" y="50">player1rm1 · player1rm2</text>

  <path class="e u" d="M380,136 Q260,216 140,136" marker-end="url(#a)"/>
  <text class="l" x="260" y="196">!player2rm1 · !player2rm2</text>

  <rect class="st" x="70" y="100" width="100" height="36" rx="6"/>
  <rect class="st" x="350" y="100" width="100" height="36" rx="6"/>
  <rect class="in" x="353.5" y="103.5" width="93" height="29" rx="4"/>
  <text class="t" x="120" y="118">Player 1</text>
  <text class="t" x="400" y="118">Player 2</text>
</svg>
