<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="The synthesised supervisor: five states survive; the removed states are faded and labelled with the round in which they were forbidden">
  <style>
    .st { fill: #ffffff; stroke: #101010; stroke-width: 1.5 }
    .bad { stroke-dasharray: 4 3 }
    .in { fill: none; stroke: #101010; stroke-width: 1 }
    .e { fill: none; stroke: #101010; stroke-width: 1.3 }
    .k { stroke-width: 2.4 }
    .u { stroke-dasharray: 5 4 }
    .ah { fill: #101010 }
    .off { opacity: 0.22 }
    .t { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #101010; text-anchor: middle; dominant-baseline: central }
    .b { font-weight: 600 }
    .n { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b6b6b; text-anchor: middle }
    .lg { text-anchor: start }
    @media (prefers-color-scheme: dark) {
      .st { fill: #151515; stroke: #ededed } .in, .e { stroke: #ededed } .ah { fill: #ededed }
      .t { fill: #ededed } .n { fill: #9a9a9a }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- everything the supervisor removes -->
  <g class="off">
    <line class="e" x1="70" y1="77" x2="200" y2="183" marker-end="url(#a)"/>
    <line class="e" x1="330" y1="77" x2="460" y2="183" marker-end="url(#a)"/>
    <line class="e" x1="330" y1="77" x2="590" y2="183" marker-end="url(#a)"/>
    <line class="e" x1="460" y1="77" x2="590" y2="183" marker-end="url(#a)"/>
    <line class="e u" x1="200" y1="183" x2="330" y2="77" marker-end="url(#a)"/>
    <line class="e u" x1="200" y1="183" x2="460" y2="77" marker-end="url(#a)"/>
    <line class="e u" x1="460" y1="183" x2="590" y2="77" marker-end="url(#a)"/>
    <line class="e u" x1="460" y1="183" x2="720" y2="77" marker-end="url(#a)"/>
    <line class="e u" x1="590" y1="183" x2="720" y2="77" marker-end="url(#a)"/>
    <rect class="st" x="288" y="43" width="84" height="34" rx="6"/>
    <rect class="st bad" x="678" y="43" width="84" height="34" rx="6"/>
    <rect class="st" x="158" y="183" width="84" height="34" rx="6"/>
    <rect class="st" x="418" y="183" width="84" height="34" rx="6"/>
    <rect class="st" x="548" y="183" width="84" height="34" rx="6"/>
    <text class="t" x="330" y="60">P1, 3</text>
    <text class="t" x="720" y="60">P1, 0</text>
    <text class="t" x="200" y="200">P2, 4</text>
    <text class="t" x="460" y="200">P2, 2</text>
    <text class="t" x="590" y="200">P2, 1</text>
  </g>
  <text class="n" x="330" y="32">round 2</text>
  <text class="n" x="720" y="32">forbidden</text>
  <text class="n" x="200" y="238">round 2</text>
  <text class="n" x="460" y="238">round 1</text>
  <text class="n" x="590" y="238">round 1</text>

  <!-- the supervisor -->
  <line class="e k" x1="2" y1="60" x2="26" y2="60" marker-end="url(#a)"/>
  <line class="e k" x1="70" y1="77" x2="330" y2="183" marker-end="url(#a)"/>
  <line class="e k u" x1="330" y1="183" x2="460" y2="77" marker-end="url(#a)"/>
  <line class="e k u" x1="330" y1="183" x2="590" y2="77" marker-end="url(#a)"/>
  <line class="e k" x1="460" y1="77" x2="720" y2="183" marker-end="url(#a)"/>
  <line class="e k" x1="590" y1="77" x2="720" y2="183" marker-end="url(#a)"/>
  <rect class="st k" x="28" y="43" width="84" height="34" rx="6"/>
  <rect class="st k" x="418" y="43" width="84" height="34" rx="6"/>
  <rect class="st k" x="548" y="43" width="84" height="34" rx="6"/>
  <rect class="st k" x="288" y="183" width="84" height="34" rx="6"/>
  <rect class="st k" x="678" y="183" width="84" height="34" rx="6"/>
  <rect class="in" x="681.5" y="186.5" width="77" height="27" rx="4"/>
  <text class="t b" x="70" y="60">P1, 5</text>
  <text class="t b" x="460" y="60">P1, 2</text>
  <text class="t b" x="590" y="60">P1, 1</text>
  <text class="t b" x="330" y="200">P2, 3</text>
  <text class="t b" x="720" y="200">P2, 0</text>
  <text class="n" x="720" y="238">goal</text>

  <!-- legend -->
  <line class="e k" x1="150" y1="276" x2="190" y2="276"/>
  <text class="n lg" x="198" y="280">kept by the supervisor</text>
  <g class="off"><line class="e" x1="400" y1="276" x2="440" y2="276"/></g>
  <text class="n lg" x="448" y="280">removed (round it was forbidden in)</text>
</svg>
