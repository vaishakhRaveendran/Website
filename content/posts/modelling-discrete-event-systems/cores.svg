<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 180" role="img" aria-label="Resource model for two cores: states 0, 1 and 2 busy cores; any task start moves right, any task completion moves left">
  <style>
    .st { fill: #ffffff; stroke: #101010; stroke-width: 1.5 }
    .in { fill: none; stroke: #101010; stroke-width: 1 }
    .e { fill: none; stroke: #101010; stroke-width: 1.4 }
    .u { stroke-dasharray: 5 4 }
    .ah { fill: #101010 }
    .t { font: 16px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #101010; text-anchor: middle; dominant-baseline: central }
    .l { font: 12px ui-monospace, Consolas, monospace; fill: #4a4a4a; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round }
    .n { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #6b6b6b; text-anchor: middle }
    @media (prefers-color-scheme: dark) {
      .st { fill: #151515; stroke: #ededed } .in, .e { stroke: #ededed } .ah { fill: #ededed }
      .t { fill: #ededed } .l { fill: #b5b5b5; stroke: #151515 } .n { fill: #9a9a9a }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <line class="e" x1="18" y1="86" x2="62" y2="86" marker-end="url(#a)"/>

  <path class="e" d="M108,66 Q185,14 262,66" marker-end="url(#a)"/>
  <path class="e" d="M298,66 Q375,14 452,66" marker-end="url(#a)"/>
  <path class="e u" d="M262,106 Q185,158 108,106" marker-end="url(#a)"/>
  <path class="e u" d="M452,106 Q375,158 298,106" marker-end="url(#a)"/>
  <text class="l" x="185" y="36">any S_Ti</text>
  <text class="l" x="375" y="36">any S_Ti</text>
  <text class="l" x="185" y="146">any C_Ti</text>
  <text class="l" x="375" y="146">any C_Ti</text>

  <circle class="st" cx="90" cy="86" r="27"/><circle class="in" cx="90" cy="86" r="22.5"/>
  <circle class="st" cx="280" cy="86" r="27"/><circle class="in" cx="280" cy="86" r="22.5"/>
  <circle class="st" cx="470" cy="86" r="27"/><circle class="in" cx="470" cy="86" r="22.5"/>
  <text class="t" x="90" y="86">0</text>
  <text class="t" x="280" y="86">1</text>
  <text class="t" x="470" y="86">2</text>
  <text class="n" x="280" y="172">number of busy cores</text>
</svg>
