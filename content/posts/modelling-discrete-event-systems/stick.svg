<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="Stick automaton: six states from Stick 5 down to Stick 0, with rm1 edges between neighbours and rm2 edges skipping one state">
  <style>
    .st { fill: #ffffff; stroke: #101010; stroke-width: 1.5 }
    .in { fill: none; stroke: #101010; stroke-width: 1 }
    .e { fill: none; stroke: #101010; stroke-width: 1.4 }
    .ah { fill: #101010 }
    .t { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #101010; text-anchor: middle; dominant-baseline: central }
    .l { font: 12px ui-monospace, Consolas, monospace; fill: #4a4a4a; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round }
    @media (prefers-color-scheme: dark) {
      .st { fill: #151515; stroke: #ededed } .in, .e { stroke: #ededed } .ah { fill: #ededed }
      .t { fill: #ededed } .l { fill: #b5b5b5; stroke: #151515 }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- initial -->
  <line class="e" x1="6" y1="115" x2="34" y2="115" marker-end="url(#a)"/>

  <!-- rm1: one stick -->
  <line class="e" x1="105" y1="115" x2="155" y2="115" marker-end="url(#a)"/>
  <line class="e" x1="225" y1="115" x2="275" y2="115" marker-end="url(#a)"/>
  <line class="e" x1="345" y1="115" x2="395" y2="115" marker-end="url(#a)"/>
  <line class="e" x1="465" y1="115" x2="515" y2="115" marker-end="url(#a)"/>
  <line class="e" x1="585" y1="115" x2="635" y2="115" marker-end="url(#a)"/>
  <text class="l" x="130" y="103">rm1</text>
  <text class="l" x="250" y="103">rm1</text>
  <text class="l" x="370" y="103">rm1</text>
  <text class="l" x="490" y="103">rm1</text>
  <text class="l" x="610" y="103">rm1</text>

  <!-- rm2: two sticks -->
  <path class="e" d="M70,98 Q190,30 310,98" marker-end="url(#a)"/>
  <path class="e" d="M310,98 Q430,30 550,98" marker-end="url(#a)"/>
  <path class="e" d="M190,132 Q310,200 430,132" marker-end="url(#a)"/>
  <path class="e" d="M430,132 Q550,200 670,132" marker-end="url(#a)"/>
  <text class="l" x="190" y="58">rm2</text>
  <text class="l" x="430" y="58">rm2</text>
  <text class="l" x="310" y="178">rm2</text>
  <text class="l" x="550" y="178">rm2</text>

  <!-- states -->
  <rect class="st" x="35" y="98" width="70" height="34" rx="6"/>
  <rect class="st" x="155" y="98" width="70" height="34" rx="6"/>
  <rect class="st" x="275" y="98" width="70" height="34" rx="6"/>
  <rect class="st" x="395" y="98" width="70" height="34" rx="6"/>
  <rect class="st" x="515" y="98" width="70" height="34" rx="6"/>
  <rect class="st" x="635" y="98" width="70" height="34" rx="6"/>
  <rect class="in" x="638.5" y="101.5" width="63" height="27" rx="4"/>
  <text class="t" x="70" y="115">Stick 5</text>
  <text class="t" x="190" y="115">Stick 4</text>
  <text class="t" x="310" y="115">Stick 3</text>
  <text class="t" x="430" y="115">Stick 2</text>
  <text class="t" x="550" y="115">Stick 1</text>
  <text class="t" x="670" y="115">Stick 0</text>
</svg>
