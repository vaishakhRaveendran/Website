<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Small learning rate converges, large learning rate diverges">
  <style>
    .ax { stroke: #cbcbcb; stroke-width: 1 }
    .curve { stroke: #101010; stroke-width: 2; fill: none }
    .step { stroke: #6b6b6b; stroke-width: 1.5; fill: none; stroke-linejoin: round }
    .dot { fill: #101010 }
    text { fill: #4a4a4a; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle }
    @media (prefers-color-scheme: dark) {
      .ax { stroke: #3a3a3a } .curve { stroke: #ededed } .step { stroke: #9a9a9a }
      .dot { fill: #ededed } text { fill: #b5b5b5 }
    }
  </style>

  <!-- η = 0.2: x ← 0.6x, converges -->
  <line class="ax" x1="20" y1="250" x2="280" y2="250"/>
  <path class="curve" d="M30 70 Q150 430 270 70"/>
  <polyline class="step" points="46,114.8 87.6,201.3 112.6,232.5 127.5,243.7 136.5,247.7"/>
  <circle class="dot" cx="46" cy="114.8" r="5"/>
  <circle class="dot" cx="87.6" cy="201.3" r="4"/>
  <circle class="dot" cx="112.6" cy="232.5" r="3.5"/>
  <circle class="dot" cx="127.5" cy="243.7" r="3"/>
  <circle class="dot" cx="136.5" cy="247.7" r="3"/>
  <text x="150" y="284">η = 0.2 · converges</text>

  <!-- η = 1.05: x ← −1.1x, diverges -->
  <line class="ax" x1="320" y1="250" x2="580" y2="250"/>
  <path class="curve" d="M330 70 Q450 430 570 70"/>
  <polyline class="step" points="386,198.8 520.4,188 372.6,175 535.2,159.3 356.4,140.5 553.2,116.9"/>
  <circle class="dot" cx="386" cy="198.8" r="5"/>
  <circle class="dot" cx="520.4" cy="188" r="4"/>
  <circle class="dot" cx="372.6" cy="175" r="4"/>
  <circle class="dot" cx="535.2" cy="159.3" r="4"/>
  <circle class="dot" cx="356.4" cy="140.5" r="4"/>
  <circle class="dot" cx="553.2" cy="116.9" r="4"/>
  <text x="450" y="284">η = 1.05 · diverges</text>
</svg>
