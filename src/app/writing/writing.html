<div class="page list-page writing">

  <header class="page-head list-head" reveal>
    <p class="eyebrow">Writing</p>
    <h1 class="page-title">Things I have written.</h1>
    <p class="page-lede">
      Notes on software, books, and whatever I have been arguing about lately.
    </p>
  </header>

  @if (posts().length) {
    <div class="entry-list" reveal>
      @for (post of posts(); track post.slug) {
        <a class="entry-row has-lead" [routerLink]="['/posts', post.slug]">
          <time class="entry-lead" [attr.datetime]="post.date">{{ post.date | date:'d MMM y' }}</time>
          <span class="entry-body">
            <span class="entry-title">{{ post.title }}</span>
            <span class="entry-note">{{ post.excerpt }}</span>
          </span>
        </a>
      }
    </div>
  } @else {
    <p class="empty">Nothing written up yet.</p>
  }

</div>
