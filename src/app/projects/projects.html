<div class="app-projects">
  <h1 id="Header">🛠️ My Builds 🛠️</h1>
  <div class="app-container">
    @for(project of ProjectsArray; track project.id) {
      <a class="project" [routerLink]="['/projects', project.id]">
        <img src={{project.image}} alt="Code Editor Extension">
        <div class="project-content">
          <h3 class="project-title">{{project.projectName}}</h3>
          <div class="project-tags">
            @for(tag of project.tags; track $index) {
              <span class="tag">{{tag}}</span>
            }
          </div>
        </div>
      </a>
    }
  </div>
</div>
