<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
/>
<div class="app-projects">
  <h1 class="animate__animated animate__bounce" id="Header">🛠️ My Builds 🛠️</h1>
  <div class="app-container">
    @for(project of ProjectsArray; track project.projectName) {
      <div class="project">
        <img src={{project.image}} alt="Code Editor Extension">
        <div class="project-content">
          <h3 class="project-title">{{project.projectName}}</h3>
          <div class="project-tags">
            @for(tag of project.tags; track $index) {
              <span class="tag">{{tag}}</span>
            }
          </div>
          <!-- <p class="project-description">
            {{project.description}}
          </p> -->
          <!-- <div class="project-links">
            @for(link of getProjectLinks(project.links); track $index) {
              <a [href]="link.url" class="project-link" target="_blank">
                {{link.name}}
              </a>
            }
          </div> -->
        </div>
      </div>
    }
  </div>
</div>
