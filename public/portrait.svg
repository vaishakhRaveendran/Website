<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img"
     aria-label="Line drawing of a face with a daisy and a leafy sprig">
  <style>
    /* Self-contained, because an external SVG loaded as an img cannot see
       the page CSS. It does follow the system colour scheme, which is what
       the site itself keys off, but support for that inside an img has been
       patchy in the past. So the base values below are deliberately chosen
       to be legible on either a light or a dark page, and the two media
       queries only refine them. Nothing disappears if they are ignored. */
    .pf-line {
      fill: none;
      stroke: #857f76;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .pf-soft { fill: #f5d6ba; }
    .pf-cool { fill: #d8c1bb; }
    .pf-warm { fill: #ddb27b; }
    .pf-soft, .pf-cool, .pf-warm { opacity: 0.75; }

    @media (prefers-color-scheme: light) {
      /* The artwork's own ink, as drawn. */
      .pf-line { stroke: #4f4b46; }
      .pf-soft, .pf-cool, .pf-warm { opacity: 1; }
    }
    @media (prefers-color-scheme: dark) {
      .pf-line { stroke: #cfcac3; }
      /* Warm pastels glow against a dark page, so hold them back. */
      .pf-soft, .pf-cool, .pf-warm { opacity: 0.42; }
    }
  </style>
